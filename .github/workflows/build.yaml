name: Build Dist And Tag

on:
  # CHANGELOG.md 有变化时触发
  push:
    branches:
      - main
    paths:
      - "CHANGELOG.md"

  # 手动触发, 用于生成 dist 并打 tag
  workflow_dispatch:

concurrency:
  group: blog-tool-ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:13
    permissions:
      contents: write
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
      OSS_BASE_URL: ${{ vars.OSS_BASE_URL }}
      OSS_DIRECTORY: ${{ vars.OSS_DIRECTORY }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git curl openssl ca-certificates

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check changelog version
        id: version_check
        working-directory: ${{ github.workspace }}
        run: |
          # 参数校验: 不允许传参
          if [ $# -gt 0 ]; then
            echo "❌ 错误: 此命令无需手动传入版本号。"
            echo "   只需运行: git savetag"
            exit 1
          fi

          # 检查 CHANGELOG.md 是否存在
          if [ ! -f "CHANGELOG.md" ]; then
            echo "❌ 错误: 找不到 CHANGELOG.md 文件" >&2
            exit 1
          fi

          VERSION=$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "❌ 错误: 无法从 CHANGELOG.md 中提取版本号。" >&2
            exit 1
          fi
          SEMVER_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! printf '%s' "$VERSION" | grep -E -q "$SEMVER_RE"; then
            echo "❌ 错误: 提取的版本号 '$VERSION' 不符合要求; 必须以小写字母 v 开头(例如 v1.2.3), 且遵循语义化版本规范(SemVer)." >&2
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "❌ 错误: Git 标签 '$VERSION' 已存在，请更新 CHANGELOG.md 中的版本号。" >&2
            exit 1
          fi
          echo "✅ 检测到版本号:  $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build dist
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Commit dist
        working-directory: ${{ github.workspace }}
        run: |
          git add dist
          if git diff --cached --quiet; then
            git commit --allow-empty -m "build+${{ steps.version_check.outputs.version }}"
          else
            git commit -m "build+${{ steps.version_check.outputs.version }}"
          fi
          git push origin HEAD:main

      - name: Upload dist to OSS
        working-directory: ${{ github.workspace }}
        run: |
          # 校验 OSS 必需变量, 避免发布阶段静默失败.
          required_vars=(
            OSS_BUCKET
            OSS_ENDPOINT
            OSS_BASE_URL
            OSS_ACCESS_KEY_ID
            OSS_ACCESS_KEY_SECRET
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name}" ]]; then
              echo "❌ 错误: 缺少必需的 OSS 配置 ${var_name}" >&2
              exit 1
            fi
          done

          oss_directory=$(printf '%s' "${OSS_DIRECTORY:-}" | sed 's#^/*##; s#/*$##')
          oss_bucket_host="${OSS_BUCKET}.${OSS_ENDPOINT}"
          oss_base_url=$(printf '%s' "$OSS_BASE_URL" | sed 's#/*$##')
          version='${{ steps.version_check.outputs.version }}'

          upload_oss_object() {
            local file_path="$1"
            local object_name="$2"
            local content_type="text/x-shellscript"
            local object_key=""
            local date_hdr=""
            local signature=""
            local http_code=""

            if [[ -n "$oss_directory" ]]; then
              object_key="${oss_directory}/${object_name}"
            else
              object_key="$object_name"
            fi

            date_hdr=$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S GMT')
            signature=$(printf 'PUT\n\n%s\n%s\n/%s/%s' "$content_type" "$date_hdr" "$OSS_BUCKET" "$object_key" | openssl dgst -sha1 -hmac "$OSS_ACCESS_KEY_SECRET" -binary | base64)

            http_code=$(curl -sS -o /tmp/oss-upload-response.xml -w '%{http_code}' \
              --connect-timeout 10 \
              --max-time 60 \
              -X PUT \
              -T "$file_path" \
              -H "Date: ${date_hdr}" \
              -H "Content-Type: ${content_type}" \
              -H "Authorization: OSS ${OSS_ACCESS_KEY_ID}:${signature}" \
              "https://${oss_bucket_host}/${object_key}")

            if [[ "$http_code" != "200" ]]; then
              echo "❌ 错误: 上传 ${object_key} 失败, HTTP 状态码 ${http_code}" >&2
              sed -n '1,20p' /tmp/oss-upload-response.xml >&2 || true
              exit 1
            fi

            echo "✅ 已上传: ${oss_base_url}/${object_key}"
          }

          upload_oss_object "dist/blog-tool.sh" "blog-tool.sh"
          upload_oss_object "dist/blog-tool.sh" "blog-tool-${version}.sh"
          upload_oss_object "dist/blog-tool-dev.sh" "blog-tool-dev.sh"
          upload_oss_object "dist/blog-tool-dev.sh" "blog-tool-dev-${version}.sh"
          upload_oss_object "dist/blog-tool-billing-center.sh" "blog-tool-billing-center.sh"
          upload_oss_object "dist/blog-tool-billing-center.sh" "blog-tool-billing-center-${version}.sh"

      - name: Create tag
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x ./.gitalias/savetag.sh
          TAG_ONLY=true ./.gitalias/savetag.sh
